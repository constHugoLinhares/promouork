# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name promouork.com.br api.promouork.com.br;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# Frontend
server {
    listen 443 ssl;
    server_name promouork.com.br;

    ssl_certificate /etc/letsencrypt/live/promouork.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/promouork.com.br/privkey.pem;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}

# Backend API
server {
    listen 443 ssl;
    server_name api.promouork.com.br;

    ssl_certificate /etc/letsencrypt/live/promouork.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/promouork.com.br/privkey.pem;

    location / {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}