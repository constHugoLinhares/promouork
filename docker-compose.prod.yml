# Produção. Variáveis do .env na raiz (ou env_file). Veja .env.example.
services:
  nginx:
    image: nginx:latest
    container_name: promouork-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    - ./infra/certbot/conf:/etc/letsencrypt
    - ./infra/certbot/data:/var/lib/letsencrypt
    depends_on:
      - backend
      - frontend
    networks:
      - promouork-network

  certbot:
    image: certbot/certbot
    container_name: promouork-certbot
    volumes:
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./infra/certbot/data:/var/lib/letsencrypt
    command: certonly --webroot \
      --webroot-path=/var/lib/letsencrypt \
      --email admin@promouork.com.br \
      --agree-tos \
      --no-eff-email \
      -d promouork.com.br \
      -d api.promouork.com.br

  postgres:
    image: postgres:15-alpine
    container_name: promouork-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - promouork-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE}
    container_name: redis
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    volumes:
      - redis_data:/data
    networks:
      - promouork-network
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: promouork-backend
    restart: "no"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FRONTEND_URL: https://promouork.com.br
      PORT: 3001
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS}
    mem_limit: 2g
    command: [ "sh", "-c", "pnpm start:prod || tail -f /dev/null" ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - promouork-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: promouork-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - promouork-network

volumes:
  postgres_data:
  redis_data:


networks:
  promouork-network:
    driver: bridge
